name: Weekly Kaggle Dataset Update

# One schedule updates every enabled dataset in kaggle_config.yaml.
# The heavy lifting lives in publish_all_weekly.py, which builds each dataset
# once and then uploads it without rebuilding.

on:
  schedule:
    # Every Monday at 03:17 UTC. Off-peak and offset from other jobs.
    - cron: "17 3 * * 1"

  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset name(s), comma-separated. Leave empty for all enabled."
        required: false
        type: string
        default: ""
      skip_build:
        description: "Upload existing files without rebuilding the data"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Validate files without calling the Kaggle API"
        required: false
        type: boolean
        default: false

concurrency:
  group: kaggle-weekly-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish_all:
    name: Build and publish datasets
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ] && { [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; }; then
            echo "::error::KAGGLE_USERNAME and KAGGLE_KEY secrets are required."
            exit 1
          fi
          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json <<EOF
          {
            "username": "$KAGGLE_USERNAME",
            "key": "$KAGGLE_KEY"
          }
          EOF
          chmod 600 ~/.kaggle/kaggle.json
          echo "✓ Kaggle credentials configured"

      - name: Update all datasets
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY || secrets.API_KEY }}
          DATASETS: ${{ github.event.inputs.dataset }}
          SKIP_BUILD: ${{ github.event.inputs.skip_build }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--yes)
          if [ -n "$DATASETS" ]; then ARGS+=(--dataset "$DATASETS"); fi
          if [ "$SKIP_BUILD" = "true" ]; then ARGS+=(--skip-build); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          echo "Running: uv run python publish_all_weekly.py ${ARGS[*]}"
          uv run python publish_all_weekly.py "${ARGS[@]}"

      - name: Verify license manifest
        env:
          DATASETS: ${{ github.event.inputs.dataset }}
        run: |
          if [ -f EnergyTrading/metadata/sources.json ]; then
            uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path("EnergyTrading/metadata/sources.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          for source in manifest["sources"]:
              if not source.get("redistribution_allowed"):
                  raise SystemExit(
                      f"Refusing to publish: {source['name']} does not allow redistribution"
                  )
          print(f"License manifest OK ({len(manifest['sources'])} sources)")
          PY
          elif [ -z "$DATASETS" ] || echo "$DATASETS" | grep -q "energy_trading"; then
            echo "::error::energy_trading was selected but its license manifest is missing."
            exit 1
          else
            echo "Skipping license check (energy_trading not selected)."
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::Weekly dataset update failed. See the logs above."
          exit 1
